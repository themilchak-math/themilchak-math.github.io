<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>더밀착수학 · 정밀진단 결과 브리핑</title>
<link rel="icon" href="./icon-192.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#2b44ff;--ink:#11152b;--mut:#5b6180;--line:#e2e5f3;--soft:#f1f3ff;--ok:#1f9d55;--acc:#e5484d;--warn:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:#e9ebf3;color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tool{position:sticky;top:0;z-index:5;background:#11152b;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.tool b{margin-right:auto}.tool a,.tool button{background:#fff2;color:#fff;border:0;border-radius:10px;padding:8px 14px;font:700 14px inherit;cursor:pointer;text-decoration:none}
.tool .on{background:var(--pri)}.tool .pr{background:#fff;color:var(--ink)}
.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:13mm 14mm;box-shadow:0 6px 30px #0002;border-radius:4px}
h1{font:700 24px "IBM Plex Sans KR","Noto Sans KR",sans-serif;margin:0;letter-spacing:-.3px}
h2{font:700 15px "IBM Plex Sans KR","Noto Sans KR",sans-serif;margin:0 0 8px;color:var(--pri);display:flex;align-items:center;gap:8px}
h2 .no{background:var(--pri);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--pri);padding-bottom:10px;margin-bottom:14px}
.hd img{width:44px;height:44px;border-radius:11px}.hd .r{margin-left:auto;text-align:right;color:var(--mut);font-size:13px}
.hd small{display:block;color:var(--mut);font-size:12.5px}
.who{font-size:17px;font-weight:700}.who span{font-weight:400;color:var(--mut);font-size:14px;margin-left:6px}
sec,.sec{display:block;margin-bottom:13px;break-inside:avoid}
.score{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.big{background:linear-gradient(160deg,#2b44ff,#5a69ff);color:#fff;border-radius:14px;padding:12px 14px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.big b{font:700 44px/1 "IBM Plex Sans KR",sans-serif}.big b small{font-size:18px}.big span{opacity:.9;font-size:13px;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv div{background:var(--soft);border-radius:10px;padding:8px 10px}.kv small{display:block;color:var(--mut);font-size:12px}.kv b{font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{border:1.5px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mut)}.tag.on{border-color:var(--pri);color:var(--pri);font-weight:700;background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;color:var(--mut);font-size:12.5px}td.t{font-weight:700;white-space:nowrap;width:92px;background:#fafbff}
tr.diff td{background:#fff8ec}tr.diff td.t::after{content:" ●";color:var(--warn)}
.legend{font-size:12px;color:var(--mut);margin-top:5px}.legend b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}.box small{display:block;color:var(--mut);font-size:12px;font-weight:700;margin-bottom:2px}
.box.hl{border-color:var(--pri);background:var(--soft)}
.rx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rx .box b{font-size:15.5px}
.sum{font-size:15px;line-height:1.65}
.foot{margin-top:14px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.mut{color:var(--mut)}.empty{color:#b0b5cc}
/* 입학신청서 */
.ap td,.ap th{padding:7px 9px}.ap th{width:110px}
.ck{display:inline-block;margin-right:10px}.ck::before{content:"☐ ";}.ck.on::before{content:"☑ ";color:var(--pri)}.ck.on{font-weight:700}
.sig{height:64px;max-width:200px;object-fit:contain}
.rules p{margin:0 0 4px;font-size:13px}
.ans h3{font-size:14px;margin:12px 0 4px;color:var(--pri)}.ans table td:first-child{width:42%;color:var(--mut)}
.msg{max-width:520px;margin:20vh auto;background:#fff;border-radius:16px;padding:26px;text-align:center}
@media screen and (max-width:820px){.page{width:auto;min-height:0;margin:10px;padding:18px}.score,.grid2,.rx,.kv{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}.tool{display:none}
  .page{margin:0;box-shadow:none;border-radius:0;width:210mm;min-height:0;height:297mm;overflow:hidden;page-break-after:always}
  .page.long{height:auto;overflow:visible}
}
</style>
</head>
<body>
<div id="app"><div class="msg">불러오는 중…</div></div>
<script type="module" src="./brief.js"></script>
</body>
</html>
