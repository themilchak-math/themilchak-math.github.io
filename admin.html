<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>더밀착수학 관리자</title>
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 더밀착수학 PC 관리자 - 폰 앱과 같은 색 */
:root{color-scheme:light;--bg:#f4f6fc;--scr:#fff;--ink:#11152b;--mut:#5b6180;--line:#e2e5f3;--pri:#2b44ff;--acc:#f2522e;--ok:#0f8f47;--warn:#b86e00;--soft:#f1f3ff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 "Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:26px;margin-bottom:18px}h1 .sub{font:400 14px "Noto Sans KR",sans-serif;margin-left:8px}
h2{font-size:17px;margin-bottom:12px}
#app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
aside{background:var(--pri);color:#fff;display:flex;flex-direction:column;padding:20px 12px}
.brand{font:700 20px "IBM Plex Sans KR",sans-serif;padding:0 10px 18px}.brand small{display:block;font-size:12.5px;opacity:.75;font-weight:500}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;display:flex;justify-content:space-between;align-items:center;font-size:15px}
nav button:hover{background:rgba(255,255,255,.12)}nav button.on{background:#fff;color:var(--pri);font-weight:700}
.foot{display:flex;flex-direction:column;gap:6px;padding:10px;font-size:13px}.foot a{color:#fff}.foot button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px;cursor:pointer}.foot small{opacity:.6}
main{overflow:auto;padding:28px 32px 60px}
main>*{max-width:1400px}
.card{background:var(--scr);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.card.hl{border-color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.grid2>.card{margin-bottom:16px}
@media(max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis div{background:var(--scr);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpis b{display:block;font:700 28px/1.1 "IBM Plex Sans KR",sans-serif}.kpis span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}thead th{border-top:0;color:var(--mut);font-weight:500;font-size:13px;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}.cen{text-align:center}
.sub{color:var(--mut);font-size:13px}.empty{color:var(--mut);text-align:center;padding:14px 0;margin:0}.err{color:var(--acc);font-weight:700}
.chip{display:inline-flex;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.ok{background:#e3f4ea;color:var(--ok)}.chip.warn{background:#faefd9;color:var(--warn)}.chip.bad{background:#fde6e0;color:var(--acc)}.chip.pri{background:#e6e9ff;color:var(--pri)}
.badge{background:var(--acc);color:#fff;border-radius:10px;font-size:11.5px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:0 16px;min-height:40px;font-weight:700;cursor:pointer}
a.btn{display:inline-flex;align-items:center;text-decoration:none;vertical-align:middle}
.btn.ghost{background:var(--soft);color:var(--pri)}.btn.sm{min-height:34px;padding:0 12px;font-size:13px}.btn.xs{min-height:28px;padding:0 9px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--acc)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar .mon{font-size:17px;min-width:110px;text-align:center}
.sw{display:inline-flex;align-items:center;gap:6px;margin-left:auto;color:var(--mut);font-size:13.5px}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;min-height:36px}
textarea{width:100%;resize:vertical}
.form{display:flex;flex-direction:column;gap:10px}.form input,.form textarea{width:100%}
.row3{display:grid;grid-template-columns:2fr 1.4fr 160px auto;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;flex-wrap:wrap;gap:6px}.ck label{border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
table.stu td{font-size:13.5px}.mem{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.mem .acts{display:flex;gap:3px}
.scroll{overflow-x:auto}
table.att{font-size:12.5px}table.att th,table.att td{padding:5px 3px;text-align:center;border:1px solid var(--line)}table.att th.nm{text-align:left;padding:5px 10px;white-space:nowrap;position:sticky;left:0;background:#fff}
table.att .sun{color:var(--acc)}table.att .sat{color:var(--pri)}table.att .tdy{outline:2px solid var(--ink);outline-offset:-2px}
td.c{min-width:28px;height:30px;font-weight:700}td.c[data-a]{cursor:pointer}td.c[data-a]:hover{background:var(--soft)}
td.c.ok{background:#e3f4ea;color:var(--ok)}td.c.warn{background:#faefd9;color:var(--warn)}td.c.bad{background:#fde6e0;color:var(--acc)}
td.sum{font-weight:700;background:var(--soft)}.legend{margin:10px 0 0}
table.log select,table.log input:not([type=checkbox]){width:100%}table.log tr.came td:first-child{box-shadow:inset 3px 0 var(--ok)}
.notice{border-top:1px solid var(--line);padding:10px 0}.notice:first-of-type{border-top:0}.notice p{white-space:pre-wrap;margin:6px 0}
.msgs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;height:calc(100vh - 140px)}.msgs .card{margin:0;overflow:auto}
.th{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 6px;cursor:pointer;border-radius:8px}.th:first-child{border-top:0}.th.on{background:var(--soft)}.th .ell{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{display:flex;flex-direction:column}.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:70%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.m small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.m.me{align-self:flex-end;background:var(--pri);color:#fff}.m.you{align-self:flex-start;background:var(--soft)}.m.sys{align-self:center;background:#f6f7fb;color:var(--mut);font-size:13px;max-width:85%}
.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1}
.qrcard{text-align:center}#qrBox{display:inline-block;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px}#qrBox img,#qrBox canvas{display:block}
.code{font:700 40px/1.2 "IBM Plex Sans KR",sans-serif;letter-spacing:.15em;margin:14px 0 4px}
.mbg{position:fixed;inset:0;background:rgba(8,10,30,.45);display:grid;place-items:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:18px;padding:22px 24px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.modal.wide{width:min(900px,100%)}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}.modal label input,.modal label select{font-weight:400}
.mf{display:flex;gap:8px;margin-top:6px}
.login{display:grid;place-items:center;height:100%;grid-column:1/-1;padding:20px}.login .card{width:min(400px,100%);display:flex;flex-direction:column;gap:10px}.login label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:30;max-width:80%}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;padding:10px}nav{flex-direction:row;flex-wrap:wrap}.foot{flex-direction:row}main{padding:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row3{grid-template-columns:1fr}.msgs{grid-template-columns:1fr;height:auto}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./admin.js"></script>
</body>
</html>
