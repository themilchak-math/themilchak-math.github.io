<script>
/* 카톡·네이버 등 앱 안 브라우저로 열리면 기본 브라우저로 넘기기 */
(function(){
  var ua=navigator.userAgent||'',url=location.href;
  var isAndroid=/Android/i.test(ua);
  if(/KAKAOTALK/i.test(ua)){
    location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);
    setTimeout(function(){window.__inapp='kakao';var o=document.getElementById('inapp');if(o)o.hidden=false},1500);
    return;
  }
  /* 갤럭시 삼성 인터넷으로 열면 알림이 안 되므로 크롬으로 바로 넘김 (크롬이 없으면 그대로 여기서 열림) */
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(isAndroid&&/SamsungBrowser/i.test(ua)&&!standalone&&!/[?&]stay=1/.test(url)){
    var stay=url+(url.indexOf('?')<0?'?':'&')+'stay=1';
    try{if(sessionStorage.getItem('tmm-tochrome'))return;sessionStorage.setItem('tmm-tochrome','1')}catch(e){}
    location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(stay)+';end';
    return;
  }
  var inapp=/NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|BAND\/|everytimeApp|whale\/.*inapp/i.test(ua);
  if(!inapp)return;
  if(isAndroid){location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';}
  window.__inapp='other';
  document.addEventListener('DOMContentLoaded',function(){var o=document.getElementById('inapp');if(o)o.hidden=false});
})();
</script>

<style>
/* 더밀착수학 앱 스타일 (시제품에서 이어옴)
   IDEA a real phone app the tutor, students and parents open every day
   PICTURE the working app itself inside a phone frame, opened mid-use
   COLOUR cobalt header field, white screens, coral for what needs attention
   TYPE IBM Plex Sans KR headings + Noto Sans KR text
   LAYOUT laptop: role switcher above a centred phone; phone: full-screen app */
:root{color-scheme:light dark;--bg:light-dark(#e9ecff,#0a0d22);--scr:light-dark(#ffffff,#13172d);--ink:light-dark(#11152b,#eef0ff);--mut:light-dark(#5b6180,#a6abc8);--line:light-dark(#e2e5f3,#2a2f4d);--pri:light-dark(#2b44ff,#6f80ff);--prid:light-dark(#1a2bc4,#2b3aa8);--acc:light-dark(#f2522e,#ff7a5c);--ok:light-dark(#0f8f47,#3ccf7d);--warn:light-dark(#b86e00,#f0b440);--soft:light-dark(#f1f3ff,#1b2040)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;margin:0;letter-spacing:-.02em;line-height:1.2}
.card .seg button{padding:6px 10px;min-height:36px;font-size:13px}
.hdr{background:var(--pri);color:#fff;padding:14px 18px 16px;flex:none}
.hdr h2{font-size:21px}
.hdr .who{font-size:13px;opacity:.9;margin-top:2px}
.hdr .back{background:none;border:0;color:#fff;font-size:15px;padding:0;margin-bottom:4px;cursor:pointer;min-height:32px}
.body{flex:1;overflow-y:auto;padding:14px 14px 20px;background:light-dark(#f6f7fc,#0f1226)}
.tabs{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-top:1px solid var(--line);background:var(--scr);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut);cursor:pointer;position:relative;min-height:54px}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:6px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.card{background:var(--scr);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font:500 12.5px "Noto Sans KR",sans-serif;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1}
.nm{font-weight:700}
.sub{color:var(--mut);font-size:13px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.c-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.c-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.c-bad{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.c-pri{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:0 16px;min-height:44px;font-weight:700;cursor:pointer}
.btn:disabled{background:var(--soft);color:var(--mut);cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--pri)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:focus-visible,.seg button:focus-visible,.tabs button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.quick button{background:var(--scr);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:72px}
.quick svg{width:24px;height:24px;fill:none;stroke:var(--pri);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big{font:700 34px/1 "IBM Plex Sans KR",sans-serif;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--scr);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font:700 24px/1.1 "IBM Plex Sans KR",sans-serif}
.stats span{font-size:12px;color:var(--mut)}
.att{display:flex;gap:4px}
.att button{border:1px solid var(--line);background:var(--scr);border-radius:9px;min-height:38px;padding:0 9px;font-size:13px;cursor:pointer}
.att button.on.s0{background:var(--ok);border-color:var(--ok);color:#fff}
.att button.on.s1{background:var(--warn);border-color:var(--warn);color:#fff}
.att button.on.s2{background:var(--acc);border-color:var(--acc);color:#fff}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.pills button{flex:none;border:1px solid var(--line);background:var(--scr);border-radius:20px;padding:0 14px;min-height:38px;cursor:pointer;font-size:14px}
.pills button.on{background:var(--ink);color:var(--scr);border-color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.units{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.units div{display:flex;gap:8px;align-items:center;font-size:14px}
.units b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;background:var(--soft);color:var(--mut)}
.units .d b{background:var(--pri);color:#fff}
.units .n b{background:var(--acc);color:#fff}
.units .n{font-weight:700}
.log{border-top:1px solid var(--line);padding:12px 0}
.log:first-of-type{border-top:0}
.log p{margin:4px 0;white-space:pre-wrap}
.stars{color:var(--warn);letter-spacing:1px}
.thr{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.thr:first-of-type{border-top:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--soft);color:var(--pri)}
.av.p{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:5px}
.msg.you{align-self:flex-start;background:var(--scr);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:var(--soft);color:var(--mut);font-size:13px;border-radius:10px;max-width:92%}
.mt{font-size:11px;color:var(--mut);align-self:flex-end;margin-top:-4px}
.mt.l{align-self:flex-start}
.send{flex:none;display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--scr)}
.send input{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);padding:0 16px;font-size:16px;background:var(--soft)}
.sheetbg{position:absolute;inset:0;background:rgba(8,10,30,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--scr);width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 20px}
.sheet h3{font-size:19px;margin-bottom:12px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--soft);min-height:46px}
.pg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.pg button,.uc{border:1px solid var(--line);background:var(--scr);border-radius:10px;min-height:40px;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.uc{padding:0 12px}
.pg button.on,.uc.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.f textarea{min-height:90px;resize:vertical}
.ck{display:flex;flex-wrap:wrap;gap:6px}
.ck label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
.notice{border-top:1px solid var(--line);padding:12px 0}
.notice:first-of-type{border-top:0}
.notice p{margin:6px 0 0;white-space:pre-wrap;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:13px;color:var(--mut);padding:2px 0}
.cal .sun{color:var(--acc)}
.cal button{border:0;border-radius:10px;min-height:46px;background:none;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.cal small{font-size:11px;line-height:1}
.cal .k0{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-weight:700}
.cal .k1{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);font-weight:700}
.cal .k2{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);font-weight:700}
.cal .td{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .sel{box-shadow:inset 0 0 0 2.5px var(--pri)}
.cal .fu{opacity:.45}
.cal button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.push{position:absolute;top:10px;left:10px;right:10px;z-index:8;background:color-mix(in srgb,var(--scr) 96%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 12px 30px -12px rgba(10,16,60,.5);font-size:14px}
.push.anim{animation:dn .3s ease-out}
.pt{display:flex;align-items:center;gap:6px;font-size:13px}
.pi{width:20px;height:20px;border-radius:6px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
@keyframes dn{from{opacity:0;transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.push{animation:none}}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--scr);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;width:max-content;max-width:88%;text-align:center;animation:up .25s ease-out}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:10px}
.sw input{width:20px;height:20px;accent-color:var(--pri)}

html,body{height:100%;overflow:hidden}
.phone{position:relative;width:100%;max-width:560px;height:100%;margin:0 auto;background:var(--scr);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hdr{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.hdr .sb{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;margin-bottom:8px;font-weight:500}
.lo{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;min-height:30px}
.who-sel{margin-top:8px;height:40px;border-radius:10px;border:0;padding:0 10px;font-size:16px;background:rgba(255,255,255,.18);color:#fff}
.who-sel option{color:#111}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;cursor:pointer;padding:8px}
.upd{position:absolute;left:10px;right:10px;bottom:70px;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--scr);padding:10px 12px;border-radius:14px;font-size:14px}
.sheetbg{padding-bottom:env(safe-area-inset-bottom)}
#inapp[hidden]{display:none!important}
.ist{margin:0 0 4px;padding-left:22px;line-height:1.9}
.upd.ib{background:var(--pri);color:#fff}
.upd.ib .btn{background:#fff;color:var(--pri)}
.upd.ib .btn.ghost{background:rgba(255,255,255,.2);color:#fff}
#reader video{width:100%!important;display:block}
/* ===== 기종별 화면 맞춤 (1.3.0) ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 아이폰 홈 화면 앱: 100vh/dvh가 상태바 높이만큼 짧게 잡혀 아래에 검은 띠가 생기는 문제 → 화면 전체에 고정 */
html,body{height:100%}
.phone{position:fixed;top:0;bottom:0;left:0;right:0;height:auto;margin:0 auto;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.tabs{padding-bottom:max(4px,env(safe-area-inset-bottom))}
.upd{bottom:calc(66px + env(safe-area-inset-bottom))}
.toast{bottom:calc(126px + env(safe-area-inset-bottom))}
.body{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
.btn.sm,.chip{white-space:nowrap}
.upd>span:first-child{min-width:0}
.upd .btn.sm{flex:none}
/* 작은 폰: 아이폰 SE·미니, 갤럭시 Z 폴드 겉화면, 보급형 (폭 360 이하) */
@media (max-width:360px){
 body{font-size:14px}
 .hdr{padding-left:14px;padding-right:14px}
 .hdr h2{font-size:19px}
 .body{padding:10px 10px 16px}
 .card{padding:13px}
 .card h3{font-size:15px}
 .stats{gap:6px}.stats div{padding:9px 8px}.stats b{font-size:20px}.stats span{font-size:11px}
 .big{font-size:28px}

 .cal button{min-height:40px;font-size:13px}.cal small{font-size:10px}

}
/* 아주 작은 화면 (폴드 겉화면 등 폭 340 이하) */
@media (max-width:340px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hdr h2{font-size:18px}
}
/* 큰 폰: 아이폰 플러스·프로맥스, 갤럭시 울트라·플러스 (폭 412 이상) */
@media (min-width:412px){
 body{font-size:16px}
 .hdr h2{font-size:23px}
 .body{padding:16px 16px 22px}
 .card{padding:18px}

/* 펼친 폴드·태블릿: 가운데 넓게 */

 .phone{max-width:680px}
 .stats b{font-size:28px}
}
/* 키 작은 화면·가로 모드: 머리 부분 줄이기 */
@media (max-height:600px){
 .hdr{padding-bottom:10px}
 .hdr .sb{margin-bottom:4px}
 .hdr h2{font-size:19px}
 .tabs button{min-height:46px;padding:5px 2px 6px}
}
@media (orientation:landscape) and (max-height:500px){
 .hdr .who{display:none}
 .upd{bottom:calc(54px + env(safe-area-inset-bottom))}
}
/* iOS 26 홈 화면 앱 버그: 화면 높이가 상태바만큼 짧게 계산돼 아래 메뉴가 떠 보임 → 실제 화면 크기로 높이 고정 */
html.ios-pwa,html.ios-pwa body{background:var(--scr)}
html.ios-pwa .phone{bottom:auto;top:var(--app-top,0px);height:var(--app-h,100%)}
html.ios-pwa .send{padding-bottom:max(10px,env(safe-area-inset-bottom))}
html.ios-pwa.kb .send{padding-bottom:10px}
</style>
<script>
/* 아이폰 홈 화면 앱: 화면 실제 높이로 맞추기 */
(function(){var ua=navigator.userAgent;var ios=/iPhone|iPod/.test(ua)||(/iPad/.test(ua));var sa=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
if(!ios||!sa)return;var r=document.documentElement;r.classList.add('ios-pwa');
function fit(){var land=Math.abs(window.orientation||0)===90||(screen.orientation&&/landscape/.test(screen.orientation.type));var h=Math.max(land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height),window.innerHeight);
 /* 키보드가 열리면 보이는 영역에 맞춰 입력칸이 키보드 바로 위에 오게, 닫히면 화면 전체로 */
 var vv=window.visualViewport,kb=!!(vv&&h-vv.height>150);r.classList.toggle('kb',kb);
 r.style.setProperty('--app-h',(kb?vv.height:h)+'px');r.style.setProperty('--app-top',(kb?vv.offsetTop:0)+'px')}
fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
/* 키보드를 닫은 뒤 iOS가 화면을 위로 밀어 둔 채 남겨 두는 문제 → 원위치 */
document.addEventListener('focusout',function(){setTimeout(function(){if(!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))window.scrollTo(0,0);fit()},80)});})();
</script>
</head>
<body>
<div class="phone" id="app"><div class="hdr"><h2>더밀착수학</h2><div class="who">불러오는 중...</div></div></div>
<div id="inapp" hidden style="position:fixed;inset:0;z-index:99;background:#2b44ff;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:28px;font:16px/1.6 'Noto Sans KR',sans-serif">
  <h2 style="font-size:24px;margin:0 0 12px">사파리·크롬에서 열어 주세요</h2>
  <p style="margin:0 0 16px">지금은 다른 앱(카톡 등) 안에서 열려 있어서 앱 설치가 안 돼요.</p>
  <p style="margin:0 0 6px"><b>아이폰:</b> 화면 아래·위의 <b>⋯</b> 또는 공유 버튼 → <b>Safari로 열기</b></p>
  <p style="margin:0 0 20px"><b>갤럭시:</b> 오른쪽 위·아래 <b>⋮</b> → <b>다른 브라우저로 열기</b> → <b>Chrome</b></p>
  <button id="inappCopy" style="height:50px;border:0;border-radius:12px;background:#fff;color:#2b44ff;font-weight:700;font-size:16px">주소 복사하기</button>
  <p id="inappMsg" style="margin:10px 0 0;font-size:14px;opacity:.9">복사한 주소를 사파리·크롬 주소창에 붙여넣어도 돼요.</p>
  <button id="inappClose" style="margin-top:18px;background:none;border:0;color:#fff;text-decoration:underline;font-size:14px">그냥 여기서 볼게요</button>
</div>
<script>
document.getElementById('inappCopy').onclick=function(){var u=location.origin+'/';try{navigator.clipboard.writeText(u).then(function(){document.getElementById('inappMsg').textContent='복사됐어요! 사파리·크롬 주소창에 붙여넣으세요.'})}catch(e){prompt('주소를 복사하세요',u)}};
document.getElementById('inappClose').onclick=function(){document.getElementById('inapp').hidden=true};
</script>
<noscript>자바스크립트를 켜야 앱을 쓸 수 있어요.</noscript>
